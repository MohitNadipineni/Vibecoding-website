name: Fix Bharat-OS Build & UI
on:
  push:
    branches: [ main ]

jobs:
  repair-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix PostCSS Config for Tailwind v4
        run: |
          echo "export default { plugins: { '@tailwindcss/postcss': {} } }" > "vibe coding/postcss.config.mjs"
          rm -f "vibe coding/postcss.config.ts"

      - name: Purge Syntax Errors in ContactForm
        run: |
          # Removes everything after the final closing brace to fix the Line 189 ghost
          sed -i '/export function ContactForm()/,/}/!d' "vibe coding/src/components/ContactForm.tsx"
          echo "" >> "vibe coding/src/components/ContactForm.tsx"

      - name: Commit & Push Fixes
        run: |
          git config --global user.name "Bharat-OS Bot"
          git config --global user.email "bot@bharat-os.io"
          git add .
          git commit -m "Auto-fix: Tailwind v4 config and syntax cleanup" || exit 0
          git push
